name: Release

# Tag pushes run a full release build. The manual trigger rebuilds an already
# existing tag without pushing a new one.
#
# A release build looks for a frontend tag carrying the same name as the backend
# tag, so shipping a release is one tag on each repository rather than a submodule
# bump commit on the backend. Without such a tag it builds the newest frontend
# commit instead.
on:
  push:
    tags:
      - "v*"
      - "4.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release"
        required: true
      frontend_repo:
        description: "Frontend repository (owner/name); empty resolves it from the submodule"
        required: false
      frontend_ref:
        description: "Frontend git ref (branch, tag or SHA); empty uses the tag matching the backend tag"
        required: false

permissions:
  contents: write

env:
  GO_VERSION: "1.26.5"
  NODE_VERSION: "22"

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Resolve build parameters
        id: params
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
            echo "frontend_repo=${{ inputs.frontend_repo }}" >> "$GITHUB_OUTPUT"
            echo "frontend_ref=${{ inputs.frontend_ref }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            # Leave both empty: the frontend is resolved from the pushed tag below.
            echo "frontend_repo=" >> "$GITHUB_OUTPUT"
            echo "frontend_ref=" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout backend
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.params.outputs.tag }}
          fetch-depth: 0

      # Resolve which frontend revision this release should carry.
      #
      # The frontend repository defaults to the one the "frontend" submodule points
      # at, so this follows a fork or a rename without editing the workflow.
      #
      # The revision is the frontend tag whose name matches the backend tag, which
      # makes a release "tag both repositories the same". When that tag is absent the
      # newest commit in the repository is used, so a release is never blocked on the
      # frontend having been tagged.
      - name: Resolve frontend revision
        id: frontend
        env:
          TAG: ${{ steps.params.outputs.tag }}
          OVERRIDE_REPO: ${{ steps.params.outputs.frontend_repo }}
          OVERRIDE_REF: ${{ steps.params.outputs.frontend_ref }}
          FRONTEND_TOKEN: ${{ secrets.FRONTEND_TOKEN }}
        run: |
          set -euo pipefail

          if [ -n "$OVERRIDE_REPO" ]; then
            if [ -z "$OVERRIDE_REF" ]; then
              echo "::error::frontend_ref is required when frontend_repo is set"
              exit 1
            fi
            echo "repo=$OVERRIDE_REPO" >> "$GITHUB_OUTPUT"
            echo "ref=$OVERRIDE_REF" >> "$GITHUB_OUTPUT"
            echo "source=override" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Derive the default repository from the submodule rather than hardcoding it.
          url="$(git config -f .gitmodules submodule.frontend.url)"
          repo="$(printf '%s' "$url" | sed -E 's#^https://[^/]+/##; s#^git@[^:]+:##; s#\.git$##')"

          if [ -z "$repo" ]; then
            echo "::error::could not derive the frontend repository from the submodule"
            exit 1
          fi

          # Probe anonymously unless a token is configured. The workflow's own
          # GITHUB_TOKEN is scoped to this repository and is not accepted as a
          # credential for a different one, so attaching it here would turn a
          # readable public repository into a failed lookup.
          if [ -n "$FRONTEND_TOKEN" ]; then
            probe="https://x-access-token:${FRONTEND_TOKEN}@github.com/${repo}.git"
          else
            probe="https://github.com/${repo}.git"
          fi

          if git ls-remote --tags --exit-code "$probe" "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "repo=$repo" >> "$GITHUB_OUTPUT"
            echo "ref=$TAG" >> "$GITHUB_OUTPUT"
            echo "source=tag" >> "$GITHUB_OUTPUT"
            echo "Using frontend tag ${TAG} from ${repo}."
            exit 0
          fi

          # No matching tag: fall back to the newest commit in the repository, taken
          # across all of its branches rather than just the default one. The default
          # branch is regularly behind the branch the frontend is developed on, so
          # following it would ship assets older than the backend they accompany.
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT

          git -C "$work" init -q
          git -C "$work" remote add origin "$probe"
          if ! git -C "$work" fetch -q --filter=blob:none --no-tags origin \
                 '+refs/heads/*:refs/remotes/origin/*'; then
            echo "::error::no frontend tag ${TAG} in ${repo} and its branches could not be read"
            exit 1
          fi

          newest_ref="$(git -C "$work" for-each-ref --sort=-committerdate \
            --format='%(refname:short)' refs/remotes/origin | head -n 1)"
          newest="$(git -C "$work" for-each-ref --sort=-committerdate \
            --format='%(objectname)' refs/remotes/origin | head -n 1)"

          if [ -z "$newest" ] || [ -z "$newest_ref" ]; then
            echo "::error::no frontend tag ${TAG} in ${repo} and it has no branches to fall back to"
            exit 1
          fi

          # The branch is reported because the newest commit is not necessarily on the
          # mainline: any branch with a recent tip can win, including an automated one.
          echo "repo=$repo" >> "$GITHUB_OUTPUT"
          echo "ref=$newest" >> "$GITHUB_OUTPUT"
          echo "source=newest" >> "$GITHUB_OUTPUT"
          echo "::warning::no frontend tag ${TAG} in ${repo}; falling back to the newest commit ${newest} (${newest_ref})."

      # The frontend is checked out into ./frontend because .build/build-assets.sh
      # reads it from there and packs the built assets into
      # application/statics/assets.zip for the go:embed directive.
      - name: Checkout frontend
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.frontend.outputs.repo }}
          ref: ${{ steps.frontend.outputs.ref }}
          path: frontend
          token: ${{ secrets.FRONTEND_TOKEN || github.token }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # The linux/arm64 image is cross-built on the amd64 runner, so binfmt/QEMU
      # must be registered before GoReleaser builds it.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      # Builds every platform binary plus checksums, and loads the linux/amd64
      # and linux/arm64 Docker images into the local daemon (skip_push in
      # .goreleaser.yaml keeps them from being pushed to a registry).
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --skip=validate --timeout 60m -p 4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Export Docker images as tarballs
        env:
          TAG: ${{ steps.params.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p release-docker
          for arch in amd64 arm64; do
            image="cloudreve/cloudreve:${TAG}-${arch}"
            docker image inspect "${image}" >/dev/null
            docker save "${image}" | gzip -9 > "release-docker/cloudreve_${TAG}_docker_linux_${arch}.tar.gz"
          done
          ls -lh release-docker

      - name: Attach Docker tarballs to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.params.outputs.tag }}
        run: gh release upload "${TAG}" release-docker/*.tar.gz --clobber
